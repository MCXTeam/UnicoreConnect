plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.25'
}

dependencies {
    implementation('co.aikar:acf-bukkit:0.5.1-SNAPSHOT')
    implementation("com.github.flinbein:PowerNBT:develop-SNAPSHOT")
    implementation project(':UnicoreConnect-common')
    implementation project(':adapters:permissions:UnicoreConnect-permissions-luckperms')
    implementation project(':adapters:economy:UnicoreConnect-economy-vault')
    implementation project(':adapters:bans:UnicoreConnect-bans-banmanager')
    implementation files('libs/PowerNBT-0.8.9.2.jar')

    compileOnly "org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT"
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'me.confuser.banmanager:BanManagerCommon:7.7.0-SNAPSHOT'
    compileOnly "com.github.MilkBowl:VaultAPI:1.7"
    compileOnly 'me.confuser.banmanager:BanManagerBukkit:7.7.0-SNAPSHOT'
    compileOnly 'net.essentialsx:EssentialsX:2.19.0'
    compileOnly files('libs/CMIAPI8.7.8.2.jar')
}