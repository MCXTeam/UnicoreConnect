name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза, например v1.1.0
        required: true

permissions:
  contents: write

jobs:
  bukkit:
    name: Bukkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bukkit
          path: build/libs/*.jar
          if-no-files-found: error

  forge:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: forge-1.19.2
            java: 17
          - platform: forge-1.20.1
            java: 17
          - platform: neoforge-1.21.1
            java: 21
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        working-directory: platforms/${{ matrix.platform }}
        run: ../../gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: platforms/${{ matrix.platform }}/build/libs/*.jar
          if-no-files-found: error

  legacy:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [forge-1.7.10, forge-1.12.2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Ядро в mavenLocal
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Сборка
        working-directory: platforms/${{ matrix.platform }}
        run: ./gradlew build --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: platforms/${{ matrix.platform }}/build/libs/*.jar
          if-no-files-found: error

  publish:
    name: Публикация релиза
    needs: [bukkit, forge, legacy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Собрать список файлов
        run: |
          mkdir -p release
          find artifacts -name '*.jar' ! -name '*-slim.jar' ! -name '*-dev.jar' -exec cp {} release/ \;
          ls -la release

      - name: Собрать список изменений
        id: changelog
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="$previous..${GITHUB_REF_NAME}"
          else
            range="${GITHUB_REF_NAME}"
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            git log --no-merges --pretty='- %s' "$range"
            echo CHANGELOG_EOF
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: UnicoreConnect ${{ github.event.inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: release/*.jar
          draft: false
          prerelease: false
