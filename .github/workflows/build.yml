name: Build

on:
  push:
    branches: ['feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bukkit:
    name: Bukkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bukkit
          path: build/libs/*.jar
          if-no-files-found: error

  forge:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: forge-1.19.2
            java: 17
          - platform: forge-1.20.1
            java: 17
          - platform: neoforge-1.21.1
            java: 21
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        working-directory: platforms/${{ matrix.platform }}
        run: ../../gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: platforms/${{ matrix.platform }}/build/libs/*.jar
          if-no-files-found: error

  legacy:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [forge-1.7.10, forge-1.12.2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Ядро в mavenLocal
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Сборка
        working-directory: platforms/${{ matrix.platform }}
        run: ./gradlew build --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: platforms/${{ matrix.platform }}/build/libs/*.jar
          if-no-files-found: error
